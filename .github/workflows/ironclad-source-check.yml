name: IRONCLAD source checks
on:
  push:
    branches: ['ironclad/**']
  workflow_dispatch:
  pull_request:
    branches: ['ironclad/1.0']
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and source checks
        run: bash ironclad/check-source.sh
      - name: Python bytecode syntax checks
        run: python3 -m compileall -q ironclad
      - name: Launcher crash and suspend brightness unit tests
        run: python3 -m unittest discover -v -s ironclad/stability -p 'test_*.py'
      - name: Switchboard and safe resume unit tests
        run: python3 -m unittest discover -v -s ironclad/switchboard -p 'test_*.py'
      - name: Disposable RG353V image-hook staging test
        run: bash ironclad/tests/test_integration_staging.sh
